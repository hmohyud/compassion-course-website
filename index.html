        <h1 style="font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;color:#0d9488;margin:0 0 1rem;">JavaScript is required to use this site</h1>
        <p>The Compassion Course site needs JavaScript turned on to load lessons, sign in, and view the community.</p>
        <p><strong>To turn it on:</strong></p>
        <ul>
          <li><strong>Chrome / Edge / Brave:</strong> Settings → Privacy and security → Site Settings → JavaScript → Allowed.</li>
          <li><strong>Safari:</strong> Preferences → Security → check "Enable JavaScript".</li>
          <li><strong>Firefox:</strong> JavaScript is on by default; check that you don't have a script-blocking extension (NoScript, Ghostery) blocking <em>compassioncourse.org</em>.</li>
          <li><strong>Work/school computer:</strong> JavaScript may be blocked by your IT department — try your home network or a phone hotspot.</li>
        </ul>
        <p>If you're still stuck, email <a href="mailto:coursecoordinator@nycnvc.org" style="color:#0d9488;">coursecoordinator@nycnvc.org</a> and we'll help.</p>
      </div>
    </noscript>
